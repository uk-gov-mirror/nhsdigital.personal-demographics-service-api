      SECRET_ACCESS_TOKEN_VALUE: $(secret.AccessToken)

  - task: PublishTestResults@2
    displayName: 'Publish proxy behaviour test results'
    inputs:
      testResultsFiles: $(ARTIFACT_PATH)/tests/proxy-behaviour-test-report.xml
