steps:
  - template: "expose-pds-variables-and-commands.yml"

  - bash: poetry install
    workingDirectory: $(ARTIFACT_PATH)
    displayName: Setup tests

  - bash: |
      export APIGEE_API_TOKEN="$SECRET_ACCESS_TOKEN_VALUE"
      export APIGEE_ACCESS_TOKEN="$SECRET_ACCESS_TOKEN_VALUE"
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"
      export INTERNAL_DEV_ASID="$INTERNAL_DEV_ASID_VALUE"

      poetry run pytest -v tests/functional/test_application_restricted.py --api-name=personal-demographics-service --proxy-name "$FULLY_QUALIFIED_SERVICE_NAME_VALUE" --junitxml=tests/functional-test-report.xml --reruns 5 --reruns-delay 1
    displayName: Run application restricted tests
    workingDirectory: "$(ARTIFACT_PATH)"
    env:
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      FULLY_QUALIFIED_SERVICE_NAME_VALUE: $(FULLY_QUALIFIED_SERVICE_NAME)
      INTERNAL_DEV_ASID_VALUE: $(INTERNAL_DEV_ASID)
      SECRET_ACCESS_TOKEN_VALUE: $(secret.AccessToken)

  - task: PublishTestResults@2
    displayName: 'Publish application restricted test results'
    inputs:
      testResultsFiles: $(ARTIFACT_PATH)/tests/functional-test-report.xml
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish application restricted test results as an artifact'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      targetPath: $(ARTIFACT_PATH)/tests/functional-test-report.xml
      artifact: pytestFunctionalTestReport    

  - bash: |
      export APIGEE_API_TOKEN="$SECRET_ACCESS_TOKEN_VALUE"
      export APIGEE_ACCESS_TOKEN="$SECRET_ACCESS_TOKEN_VALUE"
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"

