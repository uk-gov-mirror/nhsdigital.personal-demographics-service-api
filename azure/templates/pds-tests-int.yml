steps:

  - template: "azure/components/aws-assume-role.yml@common"
    parameters:
     role: "auto-ops"
     profile: "apm_ptl"

  - template: "azure/components/get-aws-secrets-and-ssm-params.yml@common"
    parameters:
      secret_file_ids:
        - ptl/app-credentials/jwt_testing/non-prod/JWT_TESTING_PRIVATE_KEY_INT
      config_ids:
        - /ptl/azure-devops/personal-demographics/int/CLIENT_ID_INT
        - /ptl/azure-devops/personal-demographics/TEST_PATIENT_ID
        - /ptl/azure-devops/personal-demographics/INTERNAL_SERVER_BASE_URI
        - /ptl/azure-devops/personal-demographics/int/EMPTY_ADDRESS_LINES_CLIENT_ID_INT
      secret_ids:
        - ptl/app-credentials/jwt_testing/non-prod/JWT_TESTING_API_KEY_INT
        - ptl/azure-devops/personal-demographics/int/CLIENT_SECRET_INT
        - ptl/azure-devops/personal-demographics/int/EMPTY_ADDRESS_LINES_CLIENT_SECRET_INT

  - bash: |
      export APPLICATION_RESTRICTED_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$JWT_TESTING_PRIVATE_KEY_INT_VALUE"
      export APPLICATION_RESTRICTED_API_KEY="$JWT_TESTING_API_KEY_INT_VALUE"
      export PDS_BASE_PATH="$SERVICE_BASE_PATH_VALUE"
      export KEY_ID="test-1"
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"
      export CLIENT_ID="$CLIENT_ID_INT_VALUE"
      export CLIENT_SECRET="$CLIENT_SECRET_INT_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_ID="$EMPTY_ADDRESS_LINES_CLIENT_ID_INT_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_SECRET="$EMPTY_ADDRESS_LINES_CLIENT_SECRET_INT_VALUE"
      export INTERNAL_SERVER_BASE_URI="$INTERNAL_SERVER_BASE_URI_VALUE"
      mvn clean test -Dtest=TestSmoke 
    displayName: 'Run Karate Smoke Tests'
    workingDirectory: "$(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests"
    env:
      CLIENT_ID_INT_VALUE: $(CLIENT_ID_INT)
      CLIENT_SECRET_INT_VALUE: $(CLIENT_SECRET_INT)
      EMPTY_ADDRESS_LINES_CLIENT_ID_INT_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_ID_INT)
      EMPTY_ADDRESS_LINES_CLIENT_SECRET_INT_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_SECRET_INT)
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      INTERNAL_SERVER_BASE_URI_VALUE: $(INTERNAL_SERVER_BASE_URI)
      JWT_TESTING_API_KEY_INT_VALUE: $(JWT_TESTING_API_KEY_INT)
      JWT_TESTING_PRIVATE_KEY_INT_VALUE: $(JWT_TESTING_PRIVATE_KEY_INT)
      PIPELINE_WORKSPACE_VALUE: $(Pipeline.Workspace)
      SERVICE_BASE_PATH_VALUE: $(SERVICE_BASE_PATH)
    
  - task: PublishTestResults@2
    displayName: 'Publish smoke test results'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      testResultsFiles: $(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests/target/karate-reports/*.xml
      failTaskOnFailedTests: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish int smoke test report as an artifact'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      pathToPublish: $(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests/target/karate-reports
      artifactName: KarateSmokeTestsHTMLReports    
