steps:

  - template: "azure/components/aws-assume-role.yml@common"
    parameters:
     role: "auto-ops"
     profile: "apm_ptl"

  - template: "azure/components/get-aws-secrets-and-ssm-params.yml@common"
    parameters:
      secret_file_ids:
        - ptl/app-credentials/jwt_testing/non-prod/JWT_TESTING_PRIVATE_KEY
        - ptl/app-credentials/jwt_testing/non-prod/PRIVILEGED_ACCESS_TESTING_SIGNING_KEY
      config_ids:
        - /ptl/azure-devops/env-internal-dev/test-app/internal-testing-internal-dev/CLIENT_ID
        - /ptl/azure-devops/env-internal-dev/test-app/internal-testing-internal-dev/CLIENT_SECRET
        - /ptl/azure-devops/env-internal-dev/test-app/internal-testing-internal-dev/EMPTY_ADDRESS_LINES_CLIENT_ID
        - /ptl/azure-devops/env-internal-dev/test-app/internal-testing-internal-dev/EMPTY_ADDRESS_LINES_CLIENT_SECRET
        - /ptl/azure-devops/personal-demographics/TEST_PATIENT_ID
        - /ptl/azure-devops/personal-demographics/INTERNAL_SERVER_BASE_URI
      secret_ids:
        - ptl/app-credentials/jwt_testing/non-prod/JWT_TESTING_API_KEY
        - ptl/app-credentials/jwt_testing/non-prod/PRIVILEGED_ACCESS_API_KEY
       
  - bash: |
      export APPLICATION_RESTRICTED_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$JWT_TESTING_PRIVATE_KEY_VALUE"
      export PRIVILEGED_ACCESS_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE"
      export APPLICATION_RESTRICTED_API_KEY="$JWT_TESTING_API_KEY_VALUE"
      export PRIVILEGED_ACCESS_API_KEY="$PRIVILEGED_ACCESS_API_KEY_VALUE"
      export PDS_BASE_PATH="$SERVICE_BASE_PATH_VALUE"
      export KEY_ID="test-1"
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"
      export CLIENT_ID="$CLIENT_ID_VALUE"
      export CLIENT_SECRET="$CLIENT_SECRET_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_ID="$EMPTY_ADDRESS_LINES_CLIENT_ID_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_SECRET="$EMPTY_ADDRESS_LINES_CLIENT_SECRET_VALUE"
      export INTERNAL_SERVER_BASE_URI="$INTERNAL_SERVER_BASE_URI_VALUE"
      mvn clean test -Dtest=TestSmoke 
    displayName: 'Run Karate Smoke Tests'
    workingDirectory: "$(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests"
    env:
      CLIENT_ID_VALUE: $(CLIENT_ID)
      CLIENT_SECRET_VALUE: $(CLIENT_SECRET)
      EMPTY_ADDRESS_LINES_CLIENT_ID_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_ID)
      EMPTY_ADDRESS_LINES_CLIENT_SECRET_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_SECRET)
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      INTERNAL_SERVER_BASE_URI_VALUE: $(INTERNAL_SERVER_BASE_URI)
      JWT_TESTING_API_KEY_VALUE: $(JWT_TESTING_API_KEY)
      JWT_TESTING_PRIVATE_KEY_VALUE: $(JWT_TESTING_PRIVATE_KEY)
      PIPELINE_WORKSPACE_VALUE: $(Pipeline.Workspace)
      PRIVILEGED_ACCESS_API_KEY_VALUE: $(PRIVILEGED_ACCESS_API_KEY)
      PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE: $(PRIVILEGED_ACCESS_TESTING_SIGNING_KEY)
      SERVICE_BASE_PATH_VALUE: $(SERVICE_BASE_PATH)
    
  - task: PublishTestResults@2
    displayName: 'Publish smoke test results'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      testResultsFiles: $(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests/target/karate-reports/*.xml
      failTaskOnFailedTests: true
      
  - task: PublishBuildArtifacts@1
    displayName: 'Publish dev-int smoke test report as an artifact'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      pathToPublish: $(Pipeline.Workspace)/s/$(SERVICE_NAME)/$(SERVICE_ARTIFACT_NAME)/karate-tests/target/karate-reports
      artifactName: KarateSmokeTestsHTMLReports    
