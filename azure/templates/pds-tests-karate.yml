steps:

  - task: Npm@1
    inputs:
      command: 'custom'
      customCommand: 'install -g @stoplight/prism-cli'

  - template: "expose-pds-variables-and-commands.yml"

  # Run the tests against veit07
  - bash: |
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"
      export PDS_BASE_PATH="$SERVICE_BASE_PATH_VALUE"
      export CLIENT_ID="$CLIENT_ID_VALUE"
      export CLIENT_SECRET="$CLIENT_SECRET_VALUE"
      export INTERACTION_FREE_CLIENT_ID="$INTERACTION_FREE_CLIENT_ID_VALUE"
      export INTERACTION_FREE_CLIENT_SECRET="$INTERACTION_FREE_CLIENT_SECRET_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_ID="$EMPTY_ADDRESS_LINES_CLIENT_ID_VALUE"
      export EMPTY_ADDRESS_LINES_CLIENT_SECRET="$EMPTY_ADDRESS_LINES_CLIENT_SECRET_VALUE"
      export CONFIDENTIAL_REMOVAL_REASONS_CLIENT_ID="$CONFIDENTIAL_REMOVAL_REASONS_CLIENT_ID_VALUE"
      export CONFIDENTIAL_REMOVAL_REASONS_CLIENT_SECRET="$CONFIDENTIAL_REMOVAL_REASONS_CLIENT_SECRET_VALUE"
      export RECORD_SHARING_CONSENT_APP_CLIENT_ID="$RECORD_SHARING_CONSENT_APP_CLIENT_ID_VALUE"
      export RECORD_SHARING_CONSENT_APP_CLIENT_SECRET="$RECORD_SHARING_CONSENT_APP_CLIENT_SECRET_VALUE"
      export APPLICATION_RESTRICTED_API_KEY="$JWT_TESTING_API_KEY_VALUE"
      export PRIVILEGED_ACCESS_API_KEY="$PRIVILEGED_ACCESS_API_KEY_VALUE"
      export APPLICATION_RESTRICTED_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$JWT_TESTING_PRIVATE_KEY_VALUE"
      export PRIVILEGED_ACCESS_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE"
      export INTERNAL_SERVER_BASE_URI="$INTERNAL_SERVER_BASE_URI_VALUE"
      export KEY_ID="$KEY_ID_VALUE"

      java -version

      mvn clean test -Dtest=TestParallel 
    displayName: 'Run Karate Tests'
    workingDirectory: "$(ARTIFACT_PATH)/karate-tests"
    env:
      CLIENT_ID_VALUE: $(CLIENT_ID)
      CLIENT_SECRET_VALUE: $(CLIENT_SECRET)
      CONFIDENTIAL_REMOVAL_REASONS_CLIENT_ID_VALUE: $(CONFIDENTIAL_REMOVAL_REASONS_CLIENT_ID)
      CONFIDENTIAL_REMOVAL_REASONS_CLIENT_SECRET_VALUE: $(CONFIDENTIAL_REMOVAL_REASONS_CLIENT_SECRET)
      EMPTY_ADDRESS_LINES_CLIENT_ID_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_ID)
      EMPTY_ADDRESS_LINES_CLIENT_SECRET_VALUE: $(EMPTY_ADDRESS_LINES_CLIENT_SECRET)
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      INTERACTION_FREE_CLIENT_ID_VALUE: $(INTERACTION_FREE_CLIENT_ID)
      INTERACTION_FREE_CLIENT_SECRET_VALUE: $(INTERACTION_FREE_CLIENT_SECRET)
      INTERNAL_SERVER_BASE_URI_VALUE: $(INTERNAL_SERVER_BASE_URI)
      JWT_TESTING_API_KEY_VALUE: $(JWT_TESTING_API_KEY)
      JWT_TESTING_PRIVATE_KEY_VALUE: $(JWT_TESTING_PRIVATE_KEY)
      KEY_ID_VALUE: $(KEY_ID)
      PIPELINE_WORKSPACE_VALUE: $(Pipeline.Workspace)
      PRIVILEGED_ACCESS_API_KEY_VALUE: $(PRIVILEGED_ACCESS_API_KEY)
      PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE: $(PRIVILEGED_ACCESS_TESTING_SIGNING_KEY)
      RECORD_SHARING_CONSENT_APP_CLIENT_ID_VALUE: $(RECORD_SHARING_CONSENT_APP_CLIENT_ID)
      RECORD_SHARING_CONSENT_APP_CLIENT_SECRET_VALUE: $(RECORD_SHARING_CONSENT_APP_CLIENT_SECRET)
      SERVICE_BASE_PATH_VALUE: $(SERVICE_BASE_PATH)
    
  - task: PublishTestResults@2
    displayName: 'Publish Karate test results'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      testResultsFiles: $(ARTIFACT_PATH)/karate-tests/target/karate-reports/*.xml
      failTaskOnFailedTests: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Karate HTML test report as an artifact'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      pathToPublish: $(ARTIFACT_PATH)/karate-tests/target/karate-reports
      artifactName: KarateHTMLReports

  # Run the tests against veit07, via the Prism proxy
  - bash: |
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export PDS_BASE_PATH="$SERVICE_BASE_PATH_VALUE"
      if [ -z "$SERVICE_ARTIFACT_NAME_VALUE" ]; then
        make publish
        export SPEC_PATH="build/personal-demographics.json"
      else
        export SPEC_PATH="personal-demographics.json"
      fi
      prism proxy $SPEC_PATH $OAUTH_BASE_URI/$PDS_BASE_PATH --errors --validate-request false &
    displayName: 'Start Prism Proxy Server'
    workingDirectory: "$(ARTIFACT_PATH)"
    env:
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      SERVICE_ARTIFACT_NAME_VALUE: $(SERVICE_ARTIFACT_NAME)
      SERVICE_BASE_PATH_VALUE: $(SERVICE_BASE_PATH)

  - bash: |
      export OAUTH_BASE_URI="https://$ENVIRONMENT_VALUE.api.service.nhs.uk"
      export OAUTH_PROXY="oauth2-mock"
      export PDS_BASE_PATH="$SERVICE_BASE_PATH_VALUE"
      export CLIENT_ID="$CLIENT_ID_VALUE"
      export CLIENT_SECRET="$CLIENT_SECRET_VALUE"
      export APPLICATION_RESTRICTED_API_KEY="$JWT_TESTING_API_KEY_VALUE"
      export PRIVILEGED_ACCESS_API_KEY="$PRIVILEGED_ACCESS_API_KEY_VALUE"
      export APPLICATION_RESTRICTED_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$JWT_TESTING_PRIVATE_KEY_VALUE"
      export PRIVILEGED_ACCESS_SIGNING_KEY_PATH="$PIPELINE_WORKSPACE_VALUE/secrets/$PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE"
      export INTERNAL_SERVER_BASE_URI="$INTERNAL_SERVER_BASE_URI_VALUE"
      export KEY_ID="$KEY_ID_VALUE"
      mvn clean test -Dtest=TestSchemaParallel 
    displayName: 'Run Schema Tests'
    workingDirectory: "$(ARTIFACT_PATH)/karate-tests"
    env:
      CLIENT_ID_VALUE: $(CLIENT_ID)
      CLIENT_SECRET_VALUE: $(CLIENT_SECRET)
      ENVIRONMENT_VALUE: $(ENVIRONMENT)
      INTERNAL_SERVER_BASE_URI_VALUE: $(INTERNAL_SERVER_BASE_URI)
      JWT_TESTING_API_KEY_VALUE: $(JWT_TESTING_API_KEY)
      JWT_TESTING_PRIVATE_KEY_VALUE: $(JWT_TESTING_PRIVATE_KEY)
      KEY_ID_VALUE: $(KEY_ID)
      PIPELINE_WORKSPACE_VALUE: $(Pipeline.Workspace)
      PRIVILEGED_ACCESS_API_KEY_VALUE: $(PRIVILEGED_ACCESS_API_KEY)
      PRIVILEGED_ACCESS_TESTING_SIGNING_KEY_VALUE: $(PRIVILEGED_ACCESS_TESTING_SIGNING_KEY)
      SERVICE_BASE_PATH_VALUE: $(SERVICE_BASE_PATH)
    
  - task: PublishTestResults@2
    displayName: 'Publish Karate Schema HTML test results'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      testResultsFiles: $(ARTIFACT_PATH)/karate-tests/target/karate-reports/*.xml
      failTaskOnFailedTests: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Karate Schema HTML test report as an artifact'
    condition: in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues', 'Failed')
    inputs:
      pathToPublish: $(ARTIFACT_PATH)/karate-tests/target/karate-reports
      artifactName: KarateSchemaTestsHTMLReports
